<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="GitKey - Generate once. Sign anywhere.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#0e1733"/>
      <stop offset="1" stop-color="#0a1f2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DDC84"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
      <animate attributeName="x1" values="0;0.4;0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="keyg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3DDC84"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3DDC84" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3DDC84" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="typeclip">
      <rect x="300" y="196" height="40" width="0">
        <animate attributeName="width" values="0;500;500;0" keyTimes="0;0.45;0.9;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',Consolas,'Courier New',monospace}
    .sans{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s ease forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .float{animation:float 5s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .pop{opacity:0;animation:pop .8s ease forwards}
    @keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .blink{animation:blink 1s steps(2) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>

  <rect width="1000" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="340" rx="22" fill="url(#grid)"/>

  <circle r="170" fill="url(#glowA)">
    <animate attributeName="cx" values="140;260;140" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;170;90" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle r="190" fill="url(#glowB)">
    <animate attributeName="cx" values="880;760;880" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="260;170;260" dur="11s" repeatCount="indefinite"/>
  </circle>

  <g fill="#ffffff">
    <circle cx="60" cy="300" r="2"><animate attributeName="cy" values="320;20" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="320" r="1.6"><animate attributeName="cy" values="330;10" dur="9s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;0" dur="9s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="330" r="2.2"><animate attributeName="cy" values="340;0" dur="8s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;0" dur="8s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="320" r="1.8"><animate attributeName="cy" values="335;5" dur="10s" begin=".5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="10s" begin=".5s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="310" r="2"><animate attributeName="cy" values="330;15" dur="6.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="6.5s" begin="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- animated key icon -->
  <g transform="translate(70 80)"><g class="float">
    <rect x="0" y="0" width="180" height="180" rx="44" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <g fill="none" stroke="url(#keyg)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <circle class="draw" pathLength="1" cx="64" cy="90" r="26"/>
      <path class="draw" pathLength="1" d="M90 90H148M126 90V112M146 90V104" style="animation-delay:.6s"/>
    </g>
    <circle cx="64" cy="90" r="7" fill="#3DDC84">
      <animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g></g>

  <!-- title -->
  <g class="pop" style="animation-delay:.3s">
    <text x="300" y="150" class="sans" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#title)">GitKey</text>
  </g>

  <!-- typing tagline -->
  <g clip-path="url(#typeclip)">
    <text x="300" y="224" class="mono" font-size="26" font-weight="600" fill="#e2e8f0">Generate once. Sign anywhere.</text>
  </g>

  <!-- chips -->
  <g class="mono pop" style="animation-delay:1.2s" font-size="13" font-weight="700">
    <rect x="300" y="262" width="150" height="30" rx="15" fill="#3DDC84" fill-opacity="0.14" stroke="#3DDC84" stroke-opacity="0.5"/>
    <text x="375" y="282" text-anchor="middle" fill="#3DDC84">100% OFFLINE</text>
    <rect x="462" y="262" width="170" height="30" rx="15" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="547" y="282" text-anchor="middle" fill="#38bdf8">ZERO TELEMETRY</text>
    <rect x="644" y="262" width="190" height="30" rx="15" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="739" y="282" text-anchor="middle" fill="#a78bfa">NO INTERNET PERM</text>
  </g>
</svg>
