<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="GitKey v2.0.0 release">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/><stop offset="0.6" stop-color="#16124a"/><stop offset="1" stop-color="#0a2a2a"/>
    </linearGradient>
    <linearGradient id="tt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DDC84"/><stop offset="0.5" stop-color="#38bdf8"/><stop offset="1" stop-color="#f472b6"/>
      <animate attributeName="x1" values="0;0.5;0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="gl" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".4"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
  </defs>
  <style>
    .sans{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
    .pop{opacity:0;animation:pop .8s ease forwards}
    @keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .badge{animation:bounce 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes bounce{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.06) rotate(2deg)}}
    .fall{animation:fall linear infinite;transform-box:fill-box;transform-origin:center}
    @keyframes fall{from{transform:translateY(-30px) rotate(0)}to{transform:translateY(330px) rotate(360deg)}}
  </style>
  <rect width="1000" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="22" fill="url(#grid)"/>
  <circle r="200" fill="url(#gl)"><animate attributeName="cx" values="200;800;200" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="60;240;60" dur="12s" repeatCount="indefinite"/></circle>

  <!-- confetti -->
  <g>
    <rect class="fall" x="90"  y="0" width="8" height="14" rx="2" fill="#3DDC84" style="animation-duration:6s"/>
    <rect class="fall" x="210" y="0" width="7" height="12" rx="2" fill="#38bdf8" style="animation-duration:8s;animation-delay:1s"/>
    <rect class="fall" x="340" y="0" width="8" height="14" rx="2" fill="#f472b6" style="animation-duration:7s;animation-delay:2s"/>
    <rect class="fall" x="470" y="0" width="7" height="12" rx="2" fill="#fbbf24" style="animation-duration:9s;animation-delay:.5s"/>
    <rect class="fall" x="620" y="0" width="8" height="14" rx="2" fill="#a78bfa" style="animation-duration:6.5s;animation-delay:1.5s"/>
    <rect class="fall" x="760" y="0" width="7" height="12" rx="2" fill="#3DDC84" style="animation-duration:8.5s;animation-delay:3s"/>
    <rect class="fall" x="900" y="0" width="8" height="14" rx="2" fill="#38bdf8" style="animation-duration:7.5s;animation-delay:.2s"/>
  </g>

  <g class="pop" style="animation-delay:.2s">
    <text x="500" y="80" text-anchor="middle" class="mono" font-size="16" font-weight="700" letter-spacing="8" fill="#94a3b8">NEW RELEASE</text>
  </g>
  <g class="pop" style="animation-delay:.5s">
    <text x="500" y="165" text-anchor="middle" class="sans" font-size="88" font-weight="800" letter-spacing="-2" fill="url(#tt)">GitKey</text>
  </g>
  <g class="badge">
    <rect x="395" y="190" width="210" height="50" rx="25" fill="#3DDC84" fill-opacity=".16" stroke="#3DDC84" stroke-width="2"/>
    <text x="500" y="224" text-anchor="middle" class="mono" font-size="26" font-weight="800" fill="#3DDC84">v2.0.0</text>
  </g>
  <g class="pop" style="animation-delay:1.1s">
    <text x="500" y="274" text-anchor="middle" class="mono" font-size="14" fill="#94a3b8">Stitch redesign  ·  20+ pro features  ·  100% offline</text>
  </g>
</svg>
